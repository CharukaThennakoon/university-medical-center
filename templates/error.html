{% extends "base.html" %}
{% block title %}{{ code }} - {{ title }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-3 text-primary">{{ code }}</h1>
    <h4>{{ title }}</h4>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Back to my dashboard</a>
</div>
{% endblock %}

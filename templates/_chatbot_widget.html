{# Floating AI assistant. Included by base.html on every page.
   Styles: static/css/chatbot.css   Behaviour: static/js/chatbot.js #}
<div id="umcChat" class="umc-chat"
     data-endpoint="{{ url_for('chatbot.message') }}"
     data-max-length="{{ config.CHATBOT_MAX_MESSAGE_LENGTH }}"
     data-history-turns="{{ config.CHATBOT_HISTORY_TURNS }}">

    <button type="button" id="umcChatToggle" class="umc-chat__fab"
            aria-label="Open the AI assistant" aria-expanded="false" aria-controls="umcChatPanel">
        <svg class="umc-chat__icon-open" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
            <path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.5L5 21.2V17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4 5v2h8V8H8zm0 4v2h5v-2H8z"/>
        </svg>
        <svg class="umc-chat__icon-close" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <section id="umcChatPanel" class="umc-chat__panel" role="dialog" aria-label="Medical Center assistant" hidden>
        <header class="umc-chat__header">
            <div class="umc-chat__avatar" aria-hidden="true">&#10010;</div>
            <div class="umc-chat__title">
                <strong>UMC Assistant</strong>
                <span>AI helper &middot; general information only</span>
            </div>
            <button type="button" id="umcChatClear" class="umc-chat__iconbtn" title="Clear conversation" aria-label="Clear conversation">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/></svg>
            </button>
            <button type="button" id="umcChatClose" class="umc-chat__iconbtn" title="Close" aria-label="Close the assistant">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </header>

        <div id="umcChatMessages" class="umc-chat__messages" role="log" aria-live="polite" tabindex="0"></div>

        <div id="umcChatChips" class="umc-chat__chips">
            <button type="button" class="umc-chat__chip">What are your opening hours?</button>
            <button type="button" class="umc-chat__chip">How do I get a token?</button>
            <button type="button" class="umc-chat__chip">Emergency contacts</button>
            <button type="button" class="umc-chat__chip">First aid for a minor burn</button>
        </div>

        <form id="umcChatForm" class="umc-chat__form" autocomplete="off">
            <textarea id="umcChatInput" rows="1" maxlength="{{ config.CHATBOT_MAX_MESSAGE_LENGTH }}"
                      placeholder="Type your question..." aria-label="Your question"></textarea>
            <button type="submit" id="umcChatSend" class="umc-chat__send" aria-label="Send message">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M3.4 20.4l17.5-7.5a1 1 0 0 0 0-1.8L3.4 3.6a1 1 0 0 0-1.4 1.1L3.5 10l9 2-9 2-1.5 5.3a1 1 0 0 0 1.4 1.1z"/></svg>
            </button>
        </form>
        <div id="umcChatCounter" class="umc-chat__counter" aria-hidden="true"></div>

        <footer class="umc-chat__note">
            AI assistant &ndash; not a substitute for a doctor. Please don't share personal or medical details.
            <strong>Emergency: call 1990.</strong>
        </footer>
    </section>
</div>
